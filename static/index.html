<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国法律RAG智能助手 | Chinese Legal RAG AI Assistant</title>
    <meta name="theme-color" content="#0f172a" />
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-balance-scale"></i>
                    <h1>中国法律RAG智能助手</h1>
                    <span class="subtitle">Chinese Legal RAG AI Assistant</span>
                </div>
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">连接中...</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" title="切换主题 / Toggle Theme" aria-label="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="welcome-icon">
                        <i class="fas fa-gavel"></i>
                    </div>
                    <h2>欢迎使用中国法律RAG智能助手</h2>
                    <p>我是基于RNN模型训练的中国法律文本生成AI助手。您可以向我咨询法律问题，我会基于训练数据为您提供相关的法律分析和建议。</p>
                    <div class="sample-questions">
                        <h3>示例问题：</h3>
                        <div class="sample-buttons">
                            <button class="sample-btn" onclick="askSample('王军的行为是否符合中国刑法关于盗窃罪的构成要件')">
                                <i class="fas fa-question-circle"></i>
                                盗窃罪构成要件分析
                            </button>
                            <button class="sample-btn" onclick="askSample('根据《刑法》第二百六十四条，本案适用的量刑幅度是什么')">
                                <i class="fas fa-book"></i>
                                量刑幅度咨询
                            </button>
                            <button class="sample-btn" onclick="askSample('王军主动认罪并退还赃物，是否应当对量刑产生影响？')">
                                <i class="fas fa-handshake"></i>
                                认罪态度影响
                            </button>
                            <button class="sample-btn" onclick="askSample('你对此案的法律意见或推荐的处理结果是什么')">
                                <i class="fas fa-lightbulb"></i>
                                法律意见建议
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="请输入您的法律问题..." 
                        rows="1"
                        maxlength="500"
                    ></textarea>
                    <div class="input-actions">
                        <div class="char-counter">
                            <span id="charCount">0</span>/500
                        </div>
                        <button id="sendButton" class="send-btn" disabled>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
                <div class="input-footer">
                    <div class="model-info">
                        <i class="fas fa-microchip"></i>
                        <span id="modelInfo">模型加载中...</span>
                    </div>
                    <div class="settings">
                        <button class="settings-btn" onclick="toggleSettings()">
                            <i class="fas fa-cog"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Settings Panel -->
            <div class="settings-panel" id="settingsPanel">
                <h3>生成设置</h3>
                <div class="setting-item">
                    <label for="maxLength">最大生成长度:</label>
                    <input type="range" id="maxLength" min="50" max="300" value="100" step="10">
                    <span id="maxLengthValue">100</span>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="showTyping" checked>
                        显示打字效果
                    </label>
                </div>
                <div class="setting-item">
                    <button class="clear-btn" onclick="clearChat()">
                        <i class="fas fa-trash"></i>
                        清空对话
                    </button>
                </div>
            </div>
        </main>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>AI正在思考中...</p>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/script.js"></script>
</body>
</html>
